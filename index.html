<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>REP JOURNAL</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rep Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060c">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Oxanium:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060c; --panel:rgba(10,24,52,.78); --panel2:rgba(16,36,74,.7); --well:rgba(4,10,24,.8);
    --line:rgba(77,195,255,.45); --glow:#4dc3ff; --glow2:#2f7dff;
    --text:#e4f2ff; --muted:#6f8db5; --dim:#2c4366;
    --pull:#ff4d6d; --push:#b37bff; --danger:#ff8a8a;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  /* Accent colour follows the exercise: pull ups = red, push ups = purple */
  .pull{--acc:var(--pull);--acc-rgb:255,77,109;}
  .push{--acc:var(--push);--acc-rgb:179,123,255;}

  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(120% 50% at 50% 0%,rgba(47,125,255,.16),transparent 60%) fixed,radial-gradient(80% 40% at 50% 100%,rgba(179,123,255,.07),transparent 70%) fixed,var(--bg);
    color:var(--text);font-family:'Rajdhani',sans-serif;font-weight:500;min-height:100vh;-webkit-tap-highlight-color:transparent;}
  body.timer-active{padding-bottom:calc(72px + var(--safe-bottom));}
  button,select,input{font-family:inherit;}

  /* ── SYSTEM WINDOW ── */
  .win{position:relative;background:linear-gradient(180deg,var(--panel),rgba(5,12,28,.88));border:1px solid var(--line);
    box-shadow:0 0 14px rgba(77,195,255,.18),inset 0 0 22px rgba(77,195,255,.06);}
  .win::before{content:"";position:absolute;inset:-2px;pointer-events:none;--c:var(--glow);
    background:
      linear-gradient(var(--c),var(--c)) top left/14px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) top left/2px 14px no-repeat,
      linear-gradient(var(--c),var(--c)) top right/14px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) top right/2px 14px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/14px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/2px 14px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/14px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/2px 14px no-repeat;
    filter:drop-shadow(0 0 4px var(--c));}
  .win-head{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);
    font-family:'Orbitron';font-size:.68rem;letter-spacing:4px;color:var(--glow);text-shadow:0 0 8px rgba(77,195,255,.7);}
  .bang{width:18px;height:18px;border:1.5px solid var(--glow);display:inline-flex;align-items:center;justify-content:center;font-size:.68rem;box-shadow:0 0 6px rgba(77,195,255,.6);}

  /* ── HEADER + NAV ── */
  .topbar{position:sticky;top:0;z-index:100;background:rgba(4,6,12,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding-top:var(--safe-top);}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  .sys-tag{font-weight:700;font-size:.62rem;letter-spacing:4px;color:var(--glow);opacity:.85;}
  h1{font-family:'Orbitron';font-weight:900;font-size:1.15rem;letter-spacing:3px;line-height:1.1;margin-top:2px;white-space:nowrap;text-shadow:0 0 10px rgba(77,195,255,.55);}
  .week-label{font-size:.75rem;color:var(--muted);letter-spacing:2px;margin-top:3px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-logo{width:46px;height:46px;flex-shrink:0;border:1px solid var(--line);box-shadow:0 0 12px rgba(77,195,255,.35);}
  @media (max-width:360px){ .brand-logo{width:36px;height:36px;} h1{font-size:.95rem;letter-spacing:2px;} }
  .lv-badge{text-align:right;flex-shrink:0;}
  .rank-box{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1.5px solid var(--glow);color:var(--glow);
    font-family:'Orbitron';font-weight:900;font-size:.95rem;box-shadow:0 0 10px rgba(77,195,255,.5);text-shadow:0 0 8px var(--glow);}
  .rank-box.s{border-color:#ffd84d;color:#ffd84d;box-shadow:0 0 12px rgba(255,216,77,.6);text-shadow:0 0 8px #ffd84d;}
  .lv-text{font-family:'Oxanium';font-weight:700;font-size:.62rem;letter-spacing:2px;margin-top:5px;}
  .xp-bar{width:84px;height:4px;background:var(--dim);margin:5px 0 0 auto;}
  .xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--glow2),var(--glow));box-shadow:0 0 6px var(--glow);}

  .nav-bar{display:flex;border-bottom:1px solid var(--line);}
  .nav-btn{flex:1;padding:11px 2px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Orbitron';font-size:.62rem;letter-spacing:3px;cursor:pointer;transition:all .15s;}
  .nav-btn.active{color:var(--glow);border-bottom-color:var(--glow);text-shadow:0 0 8px rgba(77,195,255,.8);box-shadow:inset 0 -8px 12px -10px var(--glow);}

  /* ── WEEK PICKER ── */
  .content{padding:14px 16px;}
  .week-picker-card{padding:10px 12px;margin-bottom:12px;}
  .week-picker-card label{display:block;font-size:.68rem;color:var(--muted);letter-spacing:3px;margin-bottom:6px;}
  .week-picker-card select{width:100%;display:block;min-width:0;background:var(--well);border:1px solid var(--dim);color:var(--text);
    font-family:'Oxanium';font-weight:700;font-size:.85rem;letter-spacing:2px;padding:9px 12px;outline:none;border-radius:0;-webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--glow) 50%),linear-gradient(135deg,var(--glow) 50%,transparent 50%);
    background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;}
  .week-picker-card select:focus{border-color:var(--glow);}
  .week-resolved{margin-top:7px;font-size:.72rem;letter-spacing:2px;color:var(--muted);}
  .week-resolved span{color:var(--text);}

  /* ── DAY TABS ── */
  /* All six tabs share the row equally, so no sideways scrolling */
  .day-tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:0 16px 4px;}
  .day-tab{min-width:0;text-align:center;padding:6px 0 5px;border:1px solid var(--dim);background:rgba(10,24,52,.4);color:var(--muted);
    font-weight:700;font-size:.72rem;letter-spacing:1px;cursor:pointer;transition:all .12s;}
  .day-tab small{display:block;font-size:.52rem;letter-spacing:.5px;color:var(--muted);margin-top:1px;}
  .day-tab .dot{display:block;width:5px;height:5px;margin:0 auto 5px;transform:rotate(45deg);background:var(--acc);box-shadow:0 0 6px var(--acc);}
  .day-tab.active{border-color:var(--acc);color:var(--text);background:rgba(var(--acc-rgb),.08);box-shadow:0 0 10px rgba(var(--acc-rgb),.35);}
  .day-tab.active small{color:var(--text);}

  /* ── DAILY QUEST ── */
  .quest-body{padding:14px 14px 16px;text-align:center;}
  .q-label{font-size:.72rem;letter-spacing:3px;color:var(--muted);}
  .workout-title{font-family:'Orbitron';font-weight:900;font-size:1.65rem;letter-spacing:3px;line-height:1.1;margin-top:4px;color:var(--acc);text-shadow:0 0 12px rgba(var(--acc-rgb),.6);}
  .workout-subtitle{font-size:.75rem;color:var(--muted);letter-spacing:2px;margin-top:4px;}
  .q-goal{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px dashed var(--dim);font-size:.85rem;letter-spacing:1px;}
  .q-goal b{font-family:'Oxanium';font-weight:800;color:var(--acc);font-size:1.1rem;text-shadow:0 0 8px rgba(var(--acc-rgb),.5);}
  .q-bar{height:5px;background:var(--dim);margin-top:8px;}
  .q-bar i{display:block;height:100%;background:var(--acc);box-shadow:0 0 8px var(--acc);transition:width .3s;}
  .q-note{font-size:.68rem;color:var(--muted);margin-top:10px;letter-spacing:2px;}
  .vest-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-size:.72rem;letter-spacing:2px;color:var(--muted);}
  .vest-ctrl{display:flex;}
  .vest-ctrl button{width:32px;height:32px;border:1px solid var(--line);background:var(--panel2);color:var(--glow);font-size:1rem;cursor:pointer;touch-action:manipulation;}
  .vest-input{width:58px;text-align:center;font-family:'Oxanium';font-weight:800;font-size:1rem;background:var(--well);border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;color:var(--acc);outline:none;appearance:textfield;-moz-appearance:textfield;}
  .vest-input::-webkit-outer-spin-button,.vest-input::-webkit-inner-spin-button{appearance:none;margin:0;}

  .section-label{font-family:'Orbitron';font-size:.62rem;letter-spacing:4px;color:var(--muted);margin:20px 0 9px;}

  /* ── SETS ── */
  .sets-container{display:flex;flex-direction:column;gap:10px;}
  .set-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);}
  .set-number{font-family:'Orbitron';font-size:.68rem;letter-spacing:3px;color:var(--muted);display:flex;align-items:center;}
  .stamp{font-size:.56rem;letter-spacing:2px;color:var(--acc);border:1px solid var(--acc);padding:2px 6px;margin-left:8px;text-shadow:0 0 6px var(--acc);}
  .set-total{font-size:.8rem;color:var(--muted);}
  .set-total span{font-family:'Oxanium';font-weight:700;font-size:.9rem;margin-right:2px;color:var(--acc);}
  .set-total span.zero{color:var(--dim);}
  .set-body{padding:10px 12px;}
  .rep-input-row{display:flex;align-items:center;gap:8px;}
  .rep-controls{display:flex;align-items:stretch;flex:1;min-width:0;}
  .rep-btn{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);background:var(--panel2);color:var(--glow);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;}
  .rep-btn:active{background:rgba(77,195,255,.2);}
  .rep-value-input{flex:1;min-width:0;width:100%;text-align:center;font-family:'Oxanium';font-weight:800;font-size:1.35rem;background:var(--well);
    border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;color:var(--acc);outline:none;
    text-shadow:0 0 8px rgba(var(--acc-rgb),.5);appearance:textfield;-moz-appearance:textfield;}
  .rep-value-input.zero{color:var(--dim);text-shadow:none;}
  .rep-value-input::-webkit-outer-spin-button,.rep-value-input::-webkit-inner-spin-button{appearance:none;margin:0;}
  .rep-prev{width:42px;flex-shrink:0;text-align:center;font-family:'Oxanium';font-weight:700;font-size:.8rem;color:var(--muted);opacity:.7;}
  .rep-prev small{display:block;font-family:'Rajdhani';font-size:.55rem;letter-spacing:1px;}
  .done-btn{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);background:var(--panel2);color:var(--glow);font-size:1rem;cursor:pointer;}
  .done-btn:active{background:rgba(77,195,255,.2);}
  .set-card.set-done{border-color:rgba(var(--acc-rgb),.7);box-shadow:0 0 14px rgba(var(--acc-rgb),.28),inset 0 0 18px rgba(var(--acc-rgb),.07);}
  .set-card.set-done::before{--c:var(--acc);}
  .set-card.set-done .done-btn{border-color:var(--acc);color:var(--acc);box-shadow:0 0 8px rgba(var(--acc-rgb),.5);}

  /* ── LADDER ── */
  .ladder-rungs{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;}
  .rung-row{display:flex;align-items:center;gap:8px;}
  .rung-num{font-size:.68rem;color:var(--muted);width:66px;letter-spacing:1px;flex-shrink:0;}
  .rung-toggle{flex:1;height:32px;border:1px solid var(--dim);background:var(--well);color:var(--muted);font-weight:700;font-size:.8rem;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;user-select:none;}
  .rung-toggle.done{background:rgba(var(--acc-rgb),.1);border-color:var(--acc);color:var(--acc);box-shadow:0 0 8px rgba(var(--acc-rgb),.3);}
  .rung-toggle.failed{opacity:.4;text-decoration:line-through;}
  .fail-btn{width:30px;height:30px;border:1px solid var(--dim);background:none;color:var(--muted);font-size:.75rem;cursor:pointer;flex-shrink:0;}
  .add-rung-btn{width:100%;height:32px;border:1px dashed var(--line);background:none;color:var(--glow);font-family:'Orbitron';font-size:.58rem;letter-spacing:2px;cursor:pointer;margin-top:3px;}

  /* ── SIDE QUESTS ── */
  .auxiliary-exercise{padding:10px 12px;margin-bottom:10px;}
  .exercise-name{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;font-weight:600;letter-spacing:1px;margin-bottom:8px;}
  .exercise-name span{font-size:.68rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .auxiliary-sets{display:flex;gap:6px;}
  .auxiliary-set{flex:1;min-width:0;border:1px solid var(--dim);background:var(--well);padding:6px;display:flex;align-items:center;}
  .auxiliary-set input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:none;color:var(--text);font-family:'Oxanium';font-weight:700;font-size:.95rem;outline:none;appearance:textfield;-moz-appearance:textfield;}
  .auxiliary-set input::-webkit-outer-spin-button,.auxiliary-set input::-webkit-inner-spin-button{appearance:none;margin:0;}

  /* ── WEEKLY PROGRESS ── */
  .week-summary{margin-top:20px;}
  .week-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;}
  .week-stat .label{font-size:.68rem;color:var(--muted);letter-spacing:2px;}
  .week-stat .val{font-family:'Oxanium';font-weight:800;font-size:1.4rem;margin-top:2px;color:var(--acc);text-shadow:0 0 8px rgba(var(--acc-rgb),.45);}
  .week-actions{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;}
  .sys-btn{width:100%;padding:11px 8px;background:none;border:1px solid var(--line);color:var(--glow);font-family:'Orbitron';font-size:.58rem;letter-spacing:2px;line-height:1.5;cursor:pointer;}
  .sys-btn.ready{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.08);box-shadow:0 0 12px rgba(var(--acc-rgb),.35);text-shadow:0 0 6px var(--acc);}
  .sys-btn.locked{border-style:dashed;border-color:var(--dim);color:var(--muted);cursor:not-allowed;}
  .sys-btn.danger{border-color:rgba(255,138,138,.3);color:var(--danger);opacity:.75;}

  /* ── STATUS VIEW ── */
  .progress-view{padding:14px 16px 24px;}
  .status-body{padding:12px 14px;}
  .lvbig{display:flex;align-items:center;gap:14px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .lvbig .n{font-family:'Oxanium';font-weight:800;font-size:2.4rem;line-height:1;text-align:center;text-shadow:0 0 14px rgba(77,195,255,.7);}
  .lvbig .n small{display:block;font-size:.58rem;letter-spacing:3px;color:var(--glow);text-shadow:none;margin-top:3px;}
  .lvbig .meta{flex:1;min-width:0;}
  .lvbig .xp-bar{width:100%;height:5px;margin:6px 0 4px;}
  .lvbig .t{font-size:.7rem;color:var(--muted);letter-spacing:1px;}
  .srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(44,67,102,.6);}
  .srow:last-of-type{border-bottom:none;}
  .srow span{color:var(--muted);letter-spacing:2px;font-size:.72rem;}
  .srow b{font-family:'Oxanium';font-weight:700;font-size:.8rem;letter-spacing:1px;}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .attr{border:1px solid var(--dim);padding:8px 10px;background:var(--well);}
  .attr .k{font-size:.68rem;letter-spacing:2px;color:var(--muted);}
  .attr .v{font-family:'Oxanium';font-weight:800;font-size:1.2rem;margin-top:2px;color:var(--acc);text-shadow:0 0 8px rgba(var(--acc-rgb),.45);}
  .type-toggle{display:flex;gap:8px;margin:16px 0 14px;}
  .type-btn{flex:1;padding:9px;border:1px solid var(--dim);background:none;font-family:'Orbitron';font-size:.6rem;letter-spacing:2px;cursor:pointer;color:var(--muted);}
  .type-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.08);box-shadow:0 0 10px rgba(var(--acc-rgb),.35);}
  .chart-card{margin-bottom:12px;}
  .chart-card canvas{display:block;padding:10px 10px 8px;}

  .history-week{margin-bottom:8px;}
  .hw-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;user-select:none;}
  .hw-label{font-size:.8rem;color:var(--muted);letter-spacing:1px;}
  .hw-current{font-size:.6rem;color:var(--glow);letter-spacing:2px;margin-top:1px;}
  .hw-total{font-family:'Oxanium';font-weight:700;font-size:1rem;color:var(--acc);}
  .hw-total small{font-family:'Rajdhani';font-size:.68rem;color:var(--muted);margin-left:3px;}
  .hw-body{padding:0 12px 10px;display:none;}
  .hw-body.open{display:block;}
  .hw-day-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid rgba(44,67,102,.6);font-size:.78rem;}
  .hw-day-name{color:var(--muted);letter-spacing:1px;}
  .hw-day-val{font-family:'Oxanium';font-weight:600;font-size:.72rem;color:var(--acc);text-align:right;}
  .no-data{text-align:center;padding:30px 20px;color:var(--muted);font-size:.75rem;letter-spacing:2px;}

  .settings{margin-top:20px;}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid rgba(44,67,102,.6);}
  .setting-k{font-family:'Orbitron';font-size:.62rem;letter-spacing:2px;}
  .setting-t{font-size:.75rem;color:var(--muted);margin-top:3px;line-height:1.35;}
  .setting-btns{display:flex;gap:6px;flex-shrink:0;}
  .mini-btn{padding:8px 10px;background:none;border:1px solid var(--line);color:var(--glow);font-family:'Orbitron';font-size:.55rem;letter-spacing:1px;cursor:pointer;white-space:nowrap;}
  .mini-btn:disabled{border-color:var(--dim);color:var(--muted);cursor:default;}
  .build{padding:10px 12px;font-size:.62rem;letter-spacing:2px;color:var(--muted);text-align:center;}

  /* ── REST TIMER ── */
  .timer-panel{display:none;position:fixed;left:0;right:0;bottom:0;height:calc(66px + var(--safe-bottom));padding:0 16px var(--safe-bottom);align-items:center;gap:14px;z-index:150;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,20,44,.97),rgba(4,8,18,.99));border-top:1px solid var(--glow);box-shadow:0 -6px 18px rgba(77,195,255,.22);}
  .timer-panel.active{display:flex;}
  .timer-info{font-family:'Orbitron';font-size:.58rem;letter-spacing:3px;color:var(--glow);}
  .timer-info small{display:block;color:var(--muted);font-family:'Rajdhani';font-size:.7rem;letter-spacing:2px;margin-top:2px;}
  .timer-display{font-family:'Oxanium';font-weight:800;font-size:1.7rem;min-width:90px;color:var(--acc,var(--text));text-shadow:0 0 10px rgba(var(--acc-rgb,77,195,255),.7);}
  .timer-skip{margin-left:auto;padding:8px 14px;background:none;border:1px solid var(--line);color:var(--glow);font-family:'Orbitron';font-size:.58rem;letter-spacing:2px;cursor:pointer;pointer-events:auto;}
</style>
</head>
<body>

<div class="topbar">
  <header>
    <div class="brand">
      <img class="brand-logo" src="icon-192.png" alt="">
      <div>
        <div class="sys-tag">[ THE SYSTEM ]</div>
        <h1>REP JOURNAL</h1>
        <div class="week-label" id="weekLabel">-</div>
      </div>
    </div>
    <div class="lv-badge" id="lvBadge"></div>
  </header>
  <div class="nav-bar">
    <button class="nav-btn active" id="navLog"      ontouchend="switchView('log')" onclick="switchView('log')">QUESTS</button>
    <button class="nav-btn"        id="navProgress" ontouchend="switchView('progress')" onclick="switchView('progress')">STATUS</button>
  </div>
</div>

<!-- LOG VIEW -->
<div id="viewLog">
  <div class="content" style="padding-bottom:0;">
    <div class="win week-picker-card">
      <label>ACTIVE WEEK</label>
      <select id="logWeekSelect" onchange="onLogWeekSelectChange()"></select>
      <div class="week-resolved" id="logWeekResolved">—</div>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>

// ── STORAGE ──────────────────────────────────────────────────────────────────
function mondayStr(d=new Date()){
  const m=new Date(d);
  m.setDate(m.getDate()-((m.getDay()+6)%7));
  m.setHours(0,0,0,0);
  return `${m.getFullYear()}_${String(m.getMonth()+1).padStart(2,'0')}_${String(m.getDate()).padStart(2,'0')}`;
}
function mondayDate(str){const[y,mo,d]=str.split('_').map(Number);return new Date(y,mo-1,d);}
function fmtWeek(str){
  const d = mondayDate(str);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtWeekShort(str){return mondayDate(str).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase();}

function getWeekNumber(d){
  const startMonday = mondayDate(PROGRAM_START_WEEK_KEY);
  const weekMonday = mondayDate(mondayStr(d));
  const diffMs = weekMonday - startMonday;
  const weeks = Math.floor(diffMs / (7 * 24 * 60 * 60 * 1000)) + 1;
  return Math.max(1, weeks);
}
function weekKeyFromNumber(weekNumber){
  const n=Math.max(1,parseInt(weekNumber,10)||1);
  const d=mondayDate(PROGRAM_START_WEEK_KEY);
  d.setDate(d.getDate()+((n-1)*7));
  return mondayStr(d);
}
function populateWeekSelect(selectedWeekNumber){

    html+=`<option value="${w}">WEEK ${w}</option>`;
  }

  sel.value=String(Math.min(selectedWeekNumber,maxWeek));
}

const HISTORY_KEY='repjournal_v3';
const WEEK_PREF_KEY='repjournal_active_week';
const ACTIVE_DAY_MAP_KEY='repjournal_active_day_by_week';
const WORKING_WEEK_KEY='repjournal_working_week';
const TIMER_KEY='repjournal_timer';

function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||{};}catch{return {};}}
function saveHistory(h){localStorage.setItem(HISTORY_KEY,JSON.stringify(h));}
function loadActiveDayMap(){try{return JSON.parse(localStorage.getItem(ACTIVE_DAY_MAP_KEY))||{};}catch{return {};}}
function saveActiveDayMap(map){localStorage.setItem(ACTIVE_DAY_MAP_KEY,JSON.stringify(map));}

let history=loadHistory();
let activeDayByWeek=loadActiveDayMap();
Object.keys(history).forEach(weekKey=>{
  if(weekKey < PROGRAM_START_WEEK_KEY) delete history[weekKey];
});
let currentWorkingWeek = localStorage.getItem(WORKING_WEEK_KEY);
if(!currentWorkingWeek || currentWorkingWeek < PROGRAM_START_WEEK_KEY){
  const loggedWeeks=Object.keys(history).sort();
  currentWorkingWeek=loggedWeeks.length>0?loggedWeeks[loggedWeeks.length-1]:PROGRAM_START_WEEK_KEY;
  localStorage.setItem(WORKING_WEEK_KEY,currentWorkingWeek);
}
let selectedWeekKey = localStorage.getItem(WEEK_PREF_KEY) || currentWorkingWeek;
if(selectedWeekKey < PROGRAM_START_WEEK_KEY) selectedWeekKey = PROGRAM_START_WEEK_KEY;
if(selectedWeekKey > currentWorkingWeek) selectedWeekKey = currentWorkingWeek;
let state=history[selectedWeekKey]||{};
function persist(){history[selectedWeekKey]=state;saveHistory(history);}
saveHistory(history);

function getPrevWeekKey(weekKey){
  const weeks = getLoggedWeekKeys().filter(wk=>wk<weekKey);
  return weeks.length?weeks[weeks.length-1]:null;
}

function getPrevSetReps(dayId, setIdx){
  const prevWeekKey = getPrevWeekKey(selectedWeekKey);
  if(!prevWeekKey) return 0;
  const prevData = history[prevWeekKey] || {};

function fmtDateInput(d){

function clampLogDay(dayId){
  const n=Number(dayId);
  if(!Number.isInteger(n)) return 0;
  return Math.max(0,Math.min(5,n));
}
function getActiveDayForWeek(weekKey){
  if(activeDayByWeek[weekKey]===undefined){
    activeDayByWeek[weekKey]=weekKey===currentWorkingWeek?Math.min(getToday(),5):0;
    saveActiveDayMap(activeDayByWeek);
  }
  return clampLogDay(activeDayByWeek[weekKey]);
}
function setActiveDayForWeek(weekKey,dayId){

}

// ── TIMER ────────────────────────────────────────────────────────────────────
// The end time is saved so the countdown survives the app being closed;
// a push notification is scheduled so the phone alerts even when minimized.
let timerInt=null, timerSecs=0, timerEnd=0;
function startTimer(workoutType, dayId, setIdx, duration){
  const defaultDur = workoutType==='max'?300:workoutType==='volume'?60:workoutType==='ladder'?30:30;
  const initialSecs = Number.isFinite(duration)?duration:defaultDur;
  const type = DAYS[dayId] ? DAYS[dayId].type : 'pull';
  const next = workoutType==='ladder' ? 'RUNG' : 'SET';
  timerEnd = Date.now() + initialSecs * 1000;
  try{ localStorage.setItem(TIMER_KEY, JSON.stringify({end:timerEnd,type,next})); }catch{}
  showTimer(type, next);
  schedulePush(initialSecs, 'REST OVER', `[ SYSTEM ] Next ${next.toLowerCase()} is ready. Return to your quest.`);
}
function showTimer(type, next){
  document.getElementById('timerInfo').innerHTML = `RECOVERY<small>NEXT ${next} IN</small>`;
  document.getElementById('timerDisplay').className = 'timer-display ' + type;
  updateGlobalTimerDisplay();
  document.getElementById('timerPanel').classList.add('active');
  document.body.classList.add('timer-active');
  clearInterval(timerInt);
  timerInt = setInterval(()=>{
    updateGlobalTimerDisplay();
    if(timerEnd - Date.now() <= 0) skipTimer();
  }, 250);
}
function updateGlobalTimerDisplay(){
  if(timerEnd>0){
    const remainingMs = timerEnd - Date.now();
    timerSecs = Math.max(0, Math.ceil(remainingMs / 1000));
  }
  const disp = document.getElementById('timerDisplay');
  const mm = String(Math.floor(timerSecs/60)).padStart(2,'0');
  const ss = String(timerSecs%60).padStart(2,'0');
  disp.textContent = `${mm}:${ss}`;
}
function skipTimer(manual){
  clearInterval(timerInt);
  timerEnd = 0;
  try{ localStorage.removeItem(TIMER_KEY); }catch{}
  document.getElementById('timerPanel').classList.remove('active');
  document.body.classList.remove('timer-active');
  if(manual) cancelPush();
}
function restoreTimer(){
  try{
    const saved = JSON.parse(localStorage.getItem(TIMER_KEY));
    if(saved && saved.end > Date.now() + 500){
      timerEnd = saved.end;
      showTimer(saved.type || 'pull', saved.next || 'SET');
    }else{
      localStorage.removeItem(TIMER_KEY);
    }
  }catch{}
}

// ── REST ALERTS (WEB PUSH) ───────────────────────────────────────────────────
let swReg=null, pushSub=null;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function isStandalone(){ return window.navigator.standalone===true || window.matchMedia('(display-mode: standalone)').matches; }
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function urlB64ToUint8Array(s){
  const b64=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
}
async function initPush(){
  if(!('serviceWorker' in navigator)) return;
  try{
    swReg = await navigator.serviceWorker.register('sw.js');
    if('PushManager' in window) pushSub = await swReg.pushManager.getSubscription();
  }catch(e){ console.warn('service worker', e); }
  updatePushUI();
}
async function togglePush(){
  if(pushSub){
    cancelPush();
    try{ await pushSub.unsubscribe(); }catch{}
    pushSub=null;
    updatePushUI();
    return;
  }
  if(IS_IOS && !isStandalone()){
    alert('On iPhone, rest alerts only work from the Home Screen app:\n\n1. Tap the Share button in Safari\n2. Tap "Add to Home Screen"\n3. Open Rep Journal from your Home Screen\n4. Come back here and tap ENABLE');
    return;
  }
  if(!pushSupported()){ alert('This browser does not support notifications.'); return; }
  const perm = await Notification.requestPermission();
  if(perm!=='granted'){ updatePushUI(); return; }
  try{
    const reg = swReg || await navigator.serviceWorker.ready;
    pushSub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC_KEY)});
  }catch(e){
    alert('Could not turn on rest alerts: ' + e.message);
  }
  updatePushUI();
}
function pushPost(path, payload){
  if(!PUSH_SERVER_URL) return Promise.resolve();
  // text/plain keeps this a "simple" request (no CORS preflight round-trip)
  return fetch(PUSH_SERVER_URL + path, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload), keepalive:true})
    .catch(e=>console.warn('push server', e));
}
function schedulePush(delaySecs, title, body){
  if(!pushSub) return;
  pushPost('/schedule', {subscription:pushSub.toJSON(), delay:delaySecs, title, body});
}
function cancelPush(){
  if(!pushSub) return;
  pushPost('/cancel', {endpoint:pushSub.endpoint});
}
function testPush(){
  schedulePush(5, 'TEST ALERT', '[ SYSTEM ] Rest alerts are working.');
  alert('Test alert sent. Minimize the app now. It should arrive in about 5 seconds.');
}
function updatePushUI(){
  const st=document.getElementById('pushStatus'), btns=document.getElementById('pushBtns');
  if(!st || !btns) return;
  let text, html;
  if(!PUSH_SERVER_URL){
    text='Alert server not connected yet.'; html='<button class="mini-btn" disabled>ENABLE</button>';
  }else if(pushSub){
    text='ON: your phone alerts you when rest ends, even when minimized.';
    html='<button class="mini-btn" onclick="testPush()">TEST</button><button class="mini-btn" onclick="togglePush()">TURN OFF</button>';
  }else if(IS_IOS && !isStandalone()){
    text='Add Rep Journal to your Home Screen to enable.'; html='<button class="mini-btn" onclick="togglePush()">HOW?</button>';
  }else if(!pushSupported()){
    text='Not supported in this browser.'; html='<button class="mini-btn" disabled>ENABLE</button>';
  }else if(Notification.permission==='denied'){
    text='Blocked. Allow in Settings → Notifications → Rep Journal.'; html='<button class="mini-btn" disabled>ENABLE</button>';
  }else{
    text='OFF: get a notification when rest ends.'; html='<button class="mini-btn" onclick="togglePush()">ENABLE</button>';
  }
  st.textContent=text; btns.innerHTML=html;
}

function exportSave(){

    const k=localStorage.key(i);

  }

function importSave(input){
  const f=input.files && input.files[0];
  input.value='';
  if(!f) return;
  f.text().then(txt=>{
    let data;
    try{ data=JSON.parse(txt); }catch{ data=null; }

    Object.entries(data.storage).forEach(([k,v])=>{ if(k.startsWith('repjournal')) localStorage.setItem(k,v); });

  });
}

// ── DATA HELPERS ─────────────────────────────────────────────────────────────
function dayState(weekData,dayId){if(!weekData[dayId])weekData[dayId]={};return weekData[dayId];}
function dayTotal(weekData,dayId){
  const day=DAYS[dayId],ds=weekData[dayId]||{};
  if(day.workout==='ladder'){let t=0;for(let s=0;s<day.sets;s++)(ds[`set_${s}`]||[]).forEach(r=>{if(!r.failed)t+=r.reps;});return t;}
  let t=0;for(let s=0;s<day.sets;s++)t+=ds[`set_${s}`]||0;return t;
}
function weekTotals(weekData){
  let pull=0,push=0;
  DAYS.forEach(d=>{const t=dayTotal(weekData,d.id);if(d.type==='pull')pull+=t;else push+=t;});
  return{pull,push};
}
function weekHasData(weekData){
  const wt=weekTotals(weekData||{});
  return (wt.pull+wt.push)>0;
}
function getLoggedWeekKeys(){
  return Object.keys(history).filter(wk=>weekHasData(history[wk]||{})).sort();
}
function getToday(){return(new Date().getDay()+6)%7;}
function isLadderSetLogged(dayData,setIdx){
  const rungs=dayData[`set_${setIdx}`]||[];
  return rungs.some(r=>!r.failed && (r.reps||0)>0);
}
function isWeekReadyToComplete(weekData){
  const regularDaysDone=DAYS.filter(d=>d.id!==5).every(d=>dayTotal(weekData,d.id)>0);
  if(!regularDaysDone) return false;
  const satData=weekData[5]||{};
  const satDay=DAYS[5];
  for(let s=0;s<satDay.sets;s++){
    if(!isLadderSetLogged(satData,s)) return false;
  }
  return true;
}
function nextWeekKey(weekKey){
  const d=mondayDate(weekKey);
  d.setDate(d.getDate()+7);
  return mondayStr(d);
}
// Push ups are done in a weighted vest; each push day remembers its load.
// A new day starts from the most recent load logged.
const VEST_STEP_KG=2.5, VEST_MAX_KG=40;
function hasVest(day){return day.type==='push';}
function lastVestKg(){
  const weeks=Object.keys(history).filter(wk=>wk<=selectedWeekKey).sort().reverse();
  for(const wk of weeks){
    const wd=history[wk]||{};
    for(const d of [...DAYS].reverse()){
      if(!hasVest(d) || (wk===selectedWeekKey && d.id>activeDay)) continue;
      const v=wd[d.id]?.vest_kg;
      if(v!==undefined) return v;
    }
  }
  return 0;
}
function stampVest(dayId){
  if(!hasVest(DAYS[dayId])) return;
  const ds=dayState(state,dayId);
  if(ds.vest_kg===undefined) ds.vest_kg=lastVestKg();
}
function saveVest(dayId,kg){
  if(!Number.isFinite(kg)) kg=0;
  dayState(state,dayId).vest_kg=Math.min(VEST_MAX_KG,Math.max(0,Math.round(kg*4)/4));
  persist();
  renderLog();
}
function setVest(dayId,input){saveVest(dayId,parseFloat(String(input.value).replace(',','.')));}
function stepVest(dayId,dir){stampVest(dayId);saveVest(dayId,state[dayId].vest_kg+dir*VEST_STEP_KG);}
function renderVest(day,ds){
  if(!hasVest(day)) return '';
  const kg=ds.vest_kg!==undefined?ds.vest_kg:lastVestKg();
  return `<div class="vest-row"><span>VEST LOAD</span><div class="vest-ctrl"><button onclick="stepVest(${day.id},-1)">−</button><input class="vest-input" type="number" inputmode="decimal" min="0" max="${VEST_MAX_KG}" step="0.5" value="${kg}" onchange="setVest(${day.id},this)"><button onclick="stepVest(${day.id},1)">+</button></div><span>KG</span></div>`;
}

function setsCleared(day,ds){
  let n=0;
  for(let s=0;s<day.sets;s++){
    if(day.workout==='ladder' ? isLadderSetLogged(ds,s) : ds[`set_${s}_done`]) n++;
  }
  return n;
}

function renderStdSets(day,ds){
  let h='';
  const cls=day.type;
  for(let s=0;s<day.sets;s++){
    const val = ds[`set_${s}`] !== undefined ? ds[`set_${s}`] : 0;
    const prev = getPrevSetReps(day.id, s) || 0;
    const done = ds[`set_${s}_done`];
    const cc = val === 0 ? 'zero' : cls;
    h+=`<div class="win set-card ${cls}${done?' set-done':''}"><div class="set-header"><div class="set-number">SET ${s+1}${done?'<span class="stamp">CLEARED</span>':''}</div><div class="set-total"><span class="${val===0?'zero':''}">${val}</span> REPS</div></div><div class="set-body"><div class="rep-input-row"><div class="rep-controls"><button class="rep-btn" ontouchend="chRep(${day.id},${s},-1)">−</button><input class="rep-value-input ${cc}" data-workout="${cls}" data-rep-input="${day.id}_${s}" type="number" min="0" inputmode="numeric" pattern="[0-9]*" value="${val}" onfocus="promptRep(${day.id},${s})" oninput="setRepValue(${day.id},${s},this,false)" onchange="updateRepValueAndTimer(${day.id},${s},this)" onblur="updateRepValueAndTimer(${day.id},${s},this)" onkeydown="if(event.key==='Enter'){event.preventDefault();updateRepValueAndTimer(${day.id},${s},this)}"><button class="rep-btn" ontouchend="chRep(${day.id},${s},1)">+</button></div><div class="rep-prev">${prev}<small>LAST WK</small></div><button class="done-btn" ontouchend="completeSet(${day.id},${s})" onclick="completeSet(${day.id},${s})">✓</button></div></div></div>`;
  }
  return h;
}

function renderLadderSets(day,ds){
  let h='';
  const cls=day.type;
  for(let s=0;s<day.sets;s++){
    const rungs=ds[`set_${s}`]||[];
    const setTot=rungs.reduce((a,r)=>a+(r.failed?0:r.reps),0);
    const cleared=isLadderSetLogged(ds,s);
    let rh='';
    rungs.forEach((r,ri)=>{
      const sc=r.failed?'failed':(r.done?'done':'');
      const ic=r.failed?'✕':(r.done?'✓':'○');
      rh+=`<div class="rung-row"><div class="rung-num">RUNG ${ri+1}</div><button class="rung-toggle ${sc}" onclick="toggleRung(${day.id},${s},${ri})">${ic} ${r.reps} REP${r.reps>1?'S':''}</button><button class="fail-btn" ontouchend="failRung(${day.id},${s},${ri})">✕</button></div>`;
    });
    h+=`<div class="win set-card ${cls}${cleared?' set-done':''}"><div class="set-header"><div class="set-number">SET ${s+1}${cleared?'<span class="stamp">CLEARED</span>':''}</div><div class="set-total"><span class="${setTot===0?'zero':''}">${setTot}</span> REPS</div></div><div class="ladder-rungs">${rh}<button class="add-rung-btn" onclick="addRung(${day.id},${s},'${day.workout}')">+ ADD NEXT RUNG</button></div></div>`;
  }
  return h;
}

function renderAuxiliaryExercises(day,ds){
  const exercises=AUXILIARY_EXERCISES[day.type];
  if(!exercises) return '';
  let h='<div class="section-label">SIDE QUESTS</div>';
  exercises.forEach(ex=>{
    h+=`<div class="win auxiliary-exercise"><div class="exercise-name">${ex.name}<span>${ex.unit}</span></div><div class="auxiliary-sets">`;
    for(let s=0;s<ex.sets;s++){
      const val=ds[`aux_${ex.id}_set_${s}`]||0;
      h+=`<div class="auxiliary-set"><input type="number" min="0" inputmode="numeric" value="${val}" data-aux-exercise="${ex.id}" data-aux-set="${s}" onchange="setAuxiliaryValue(${day.id},'${ex.id}',${s},this)"></div>`;
    }
    h+='</div></div>';
  });
  return h;
}

function setAuxiliaryValue(dayId,exerciseId,setIdx,input){
  stampVest(dayId);
  const val=Math.max(0,parseInt(input.value,10)||0);
  const ds=dayState(state,dayId);
  ds[`aux_${exerciseId}_set_${setIdx}`]=val;
  persist();
  renderLog();
}

function renderLog(){
  renderTabs();
  const day=DAYS[activeDay],ds=dayState(state,activeDay);
  const cls=day.type,tot=dayTotal(state,activeDay),wt=weekTotals(state);
  const cleared=setsCleared(day,ds);
  const weekReady=isWeekReadyToComplete(state);
  const setsHtml=day.workout==='ladder'?renderLadderSets(day,ds):renderStdSets(day,ds);
  const auxHtml=renderAuxiliaryExercises(day,ds);
  document.getElementById('content').innerHTML=`
    <div class="win ${cls}">
      <div class="win-head"><span class="bang">!</span>DAILY QUEST</div>
      <div class="quest-body">
        <div class="q-label">${day.label} · TRAINING TO BECOME STRONGER</div>
        <div class="workout-title">${TYPE_NAMES[cls]}</div>
        <div class="workout-subtitle">${WORKOUT_LABELS[day.workout]}</div>
        ${renderVest(day,ds)}
        <div class="q-goal"><span>REPS CLEARED</span><b>${tot}</b></div>
        <div class="q-bar"><i style="width:${cleared/day.sets*100}%"></i></div>
        <div class="q-note">SETS ${cleared} / ${day.sets} CLEARED</div>
      </div>
    </div>
    <div class="section-label">SETS</div>
    <div class="sets-container">${setsHtml}</div>
    ${auxHtml}
    <div class="win week-summary">
      <div class="win-head"><span class="bang">!</span>WEEKLY PROGRESS</div>
      <div class="week-grid">
        <div class="week-stat pull"><div class="label">PULL UPS</div><div class="val">${wt.pull}</div></div>
        <div class="week-stat push"><div class="label">PUSH UPS</div><div class="val">${wt.push}</div></div>
      </div>
      <div class="week-actions ${cls}">
        <button class="sys-btn ${weekReady?'ready':'locked'}" ontouchend="completeWeekAndAdvance()" onclick="completeWeekAndAdvance()" ${weekReady?'':'disabled'}>${weekReady?'QUEST COMPLETE · START NEXT WEEK':'🔒 CLEAR SAT LADDER (ALL 5 SETS) TO ADVANCE'}</button>
        <button class="sys-btn danger" ontouchend="resetWeek()">RESET WEEK</button>
      </div>
    </div>`;
  renderHeader();
  populateWeekSelect(getWeekNumber(mondayDate(selectedWeekKey)));
  const weekResolved = document.getElementById('logWeekResolved');
  if(weekResolved){
    weekResolved.innerHTML = `LOGGING IN <span>${fmtWeek(selectedWeekKey)}</span>`;
  }
}

function chRep(dayId,si,delta){stampVest(dayId);const ds=dayState(state,dayId),k=`set_${si}`;const current=ds[k]!==undefined?ds[k]:0;ds[k]=Math.max(0,current+delta);if(ds[k]===0)ds[`${k}_done`]=false;persist();renderLog();}
function parseRepValue(value){
  const digits=String(value??'').replace(/\D/g,'');
  if(!digits) return 0;
  return Math.max(0,parseInt(digits,10) || 0);
}
function normalizeRepInput(input){
  let digits=String(input.value??'').replace(/\D/g,'');
  if(digits.length>1) digits=digits.replace(/^0+/,'') || '0';
  if(input.value!==digits) input.value=digits;
  return digits;
}
function setRepValue(dayId,si,input,rerender){
  stampVest(dayId);
  const ds=dayState(state,dayId),k=`set_${si}`;
  ds[k]=parseRepValue(normalizeRepInput(input));
  if(ds[k]===0)ds[`${k}_done`]=false;
  const cls=input?.dataset?.workout || '';
  input.className = `rep-value-input ${ds[k]===0 ? 'zero' : cls}`.trim();
  persist();
  if(rerender) renderLog();
}
function updateRepValueAndTimer(dayId,si,input){
  setRepValue(dayId,si,input,false);
  const value = parseRepValue(input?.value);
  if(value>0){
    completeSet(dayId,si);
  }else{
    renderLog();
  }
}
function promptRep(dayId,si){
  const input=document.querySelector(`[data-rep-input="${dayId}_${si}"]`);
  if(!input) return;
  input.focus();
  input.select();
}
function completeSet(dayId,si){
  stampVest(dayId);
  const day=DAYS[dayId];
  const ds=dayState(state,dayId);
  const k=`set_${si}`;
  const current=ds[k]!==undefined?ds[k]:0;
  ds[k]=Math.max(0,current);
  ds[`${k}_done`]=true;
  persist();
  startTimer(day.workout, dayId, si);
  renderLog();
}
function addRung(dayId,si,type){stampVest(dayId);const ds=dayState(state,dayId),k=`set_${si}`;if(!ds[k])ds[k]=[];const rungs=ds[k];rungs.push({reps:rungs.length+1,done:false,failed:false});persist();renderLog();startTimer('ladder',dayId,si,30);}function toggleRung(dayId,si,ri){stampVest(dayId);const ds=dayState(state,dayId),rungs=ds[`set_${si}`]||[];if(rungs[ri]&&!rungs[ri].failed){rungs[ri].done=!rungs[ri].done;if(rungs[ri].done)startTimer('ladder',dayId,si,30);}persist();renderLog();}
function failRung(dayId,si,ri){
  const ds=dayState(state,dayId),rungs=ds[`set_${si}`]||[];
  if(rungs[ri]) rungs.splice(ri,1);
  persist();
  renderLog();
}
function resetWeek(){
  if(!confirm(`Reset all data for week of ${fmtWeek(selectedWeekKey)}?`))return;
  history[selectedWeekKey]={};
  state=history[selectedWeekKey];
  saveHistory(history);
  renderLog();
}
function completeWeekAndAdvance(){
  if(!isWeekReadyToComplete(state)){
    alert('Complete all workout days and finish Saturday ladder in all 5 sets before starting the next week.');
    return;
  }
  const nextKey=nextWeekKey(selectedWeekKey);
  if(!history[nextKey]) history[nextKey]={};
  currentWorkingWeek=nextKey;
  localStorage.setItem(WORKING_WEEK_KEY,nextKey);
  setSelectedWeek(nextKey);
  setActiveDayForWeek(nextKey,0);
  renderLog();
}

// ── STATUS (PROGRESS) VIEW ───────────────────────────────────────────────────
let progressType='pull',chartWeekly=null,chartDay=null;
function setProgressType(t){progressType=t;renderProgress();}
function toggleHistWeek(el){el.nextElementSibling.classList.toggle('open');}

function renderProgress(){
  const pc=document.getElementById('progressContent');
  const weeks=getLoggedWeekKeys();
  const type=progressType;
  const {line:color,fill:colorA}=TYPE_COLORS[type];
  const p=playerStatus();
  const weeksCleared=weeks.filter(wk=>wk<currentWorkingWeek).length;
  const wkLabels=[],wkTotals=[];
  weeks.forEach(wk=>{wkLabels.push(fmtWeekShort(wk));const wt=weekTotals(history[wk]||{});wkTotals.push(type==='pull'?wt.pull:wt.push);});
  const typeDays=DAYS.filter(d=>d.type===type);
  const DASH={max:[],volume:[6,4],ladder:[2,3]};
  const POINT={max:'circle',volume:'rect',ladder:'triangle'};
  const dayDatasets=typeDays.map(day=>({
    label: WORKOUT_SHORT[day.workout],
    data:weeks.map(wk=>{
      const reps=dayTotal(history[wk]||{},day.id);
      return reps>0?reps:null;
    }),
    borderColor:color,
    backgroundColor:color,
    borderDash:DASH[day.workout],
    pointStyle:POINT[day.workout],
    tension:0,pointRadius:4,
    spanGaps:false,
    borderWidth:2,
  }));

  let histHtml='';
  if(weeks.length===0){histHtml='<div class="no-data">NO DATA YET · START LOGGING!</div>';}
  else{
    [...weeks].reverse().forEach(wk=>{
      const wd=history[wk]||{},wt=weekTotals(wd),tot=type==='pull'?wt.pull:wt.push,isCur=wk===selectedWeekKey;
      let typeSets = {}, vestByLabel = {};
      DAYS.filter(d=>d.type===type).forEach(day=>{
        const dayTypeLabel = WORKOUT_NAMES[day.workout];
        if(!typeSets[dayTypeLabel]) typeSets[dayTypeLabel] = [];
        const kg = wd[day.id]?.vest_kg;
        if(hasVest(day) && kg) vestByLabel[dayTypeLabel] = kg;
        for(let s=0; s<day.sets; s++){
          let setReps = 0;
          if(day.workout === 'ladder'){
            const rungs = wd[day.id]?.[`set_${s}`] || [];
            rungs.forEach(r => { if(!r.failed) setReps += r.reps; });
          } else {
            setReps = wd[day.id]?.[`set_${s}`] || 0;
          }
          if(setReps > 0) typeSets[dayTypeLabel].push(`${setReps}`);
        }
      });
      let drows = '';
      Object.keys(typeSets).forEach(typeLabel => {
        if(typeSets[typeLabel].length > 0){
          drows += `<div class="hw-day-row"><span class="hw-day-name">${typeLabel}${vestByLabel[typeLabel]?` · ${vestByLabel[typeLabel]} KG`:''}</span><span class="hw-day-val">${typeSets[typeLabel].join(', ')}</span></div>`;
        }
      });
      histHtml+=`<div class="win history-week ${type}"><div class="hw-header" ontouchend="toggleHistWeek(this)" onclick="toggleHistWeek(this)"><div><div class="hw-label">${fmtWeek(wk)}</div>${isCur?'<div class="hw-current">ACTIVE WEEK</div>':''}</div><div class="hw-total">${tot}<small>REPS</small></div></div><div class="hw-body">${drows}</div></div>`;
    });
  }

  pc.innerHTML=`
    <div class="win">
      <div class="win-head"><span class="bang">!</span>STATUS</div>
      <div class="status-body">
        <div class="lvbig">
          <div class="n">${p.level}<small>LEVEL</small></div>
          <div class="meta">
            <div class="srow" style="border:none;padding:0"><span>RANK</span><b>${p.rank}</b></div>
            <div class="xp-bar"><i style="width:${p.into/XP_PER_LEVEL*100}%"></i></div>
            <div class="t">${p.into} / ${XP_PER_LEVEL} XP TO LV. ${p.level+1}</div>
          </div>
        </div>
        <div class="srow"><span>TITLE</span><b>${p.title}</b></div>
        <div class="srow"><span>WEEKS CLEARED</span><b>${weeksCleared}</b></div>
        <div class="attrs">
          <div class="attr pull"><div class="k">PULL UPS</div><div class="v">${p.pull.toLocaleString()}</div></div>
          <div class="attr push"><div class="k">PUSH UPS</div><div class="v">${p.push.toLocaleString()}</div></div>
        </div>
      </div>
    </div>
    <div class="type-toggle">
      <button class="type-btn pull ${type==='pull'?'active':''}" ontouchend="setProgressType('pull')" onclick="setProgressType('pull')">PULL UPS</button>
      <button class="type-btn push ${type==='push'?'active':''}" ontouchend="setProgressType('push')" onclick="setProgressType('push')">PUSH UPS</button>
    </div>
    <div class="win chart-card"><div class="win-head">WEEKLY TOTAL REPS</div><canvas id="weeklyChart" height="155"></canvas></div>
    <div class="win chart-card"><div class="win-head">REPS PER SESSION</div><canvas id="dayChart" height="185"></canvas></div>
    <div class="section-label">QUEST LOG</div>${histHtml}
    <div class="win settings">
      <div class="win-head">SYSTEM SETTINGS</div>
      <div class="setting-row"><div><div class="setting-k">REST ALERTS</div><div class="setting-t" id="pushStatus"></div></div><div class="setting-btns" id="pushBtns"></div></div>
      <div class="setting-row"><div><div class="setting-k">SAVE DATA</div><div class="setting-t">Back up your history, or move it to another device or the Home Screen app.</div></div><div class="setting-btns"><button class="mini-btn" onclick="exportSave()">EXPORT</button><button class="mini-btn" onclick="document.getElementById('importFile').click()">IMPORT</button></div></div>
      <div class="build">BUILD ${APP_VERSION}</div>
    </div>`;
  updatePushUI();

  if(chartWeekly){chartWeekly.destroy();chartWeekly=null;}
  if(chartDay){chartDay.destroy();chartDay=null;}
  const gc='#13233f', tc='#6f8db5';
  Chart.defaults.color=tc;Chart.defaults.font.family="'Rajdhani', sans-serif";Chart.defaults.font.size=11;Chart.defaults.font.weight='600';

  chartWeekly=new Chart(document.getElementById('weeklyChart').getContext('2d'),{
    type:'bar',
    data:{labels:wkLabels,datasets:[{label:TYPE_NAMES[type],data:wkTotals,backgroundColor:colorA,borderColor:color,borderWidth:1.5,borderRadius:0}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:gc},ticks:{color:tc,maxRotation:40}},y:{grid:{color:gc},ticks:{color:tc},beginAtZero:true}}}
  });
  chartDay=new Chart(document.getElementById('dayChart').getContext('2d'),{
    type:'line',
    data:{labels:wkLabels,datasets:dayDatasets},
    options:{responsive:true,plugins:{legend:{display:true,labels:{color:tc,usePointStyle:true,pointStyleWidth:10,boxHeight:7,padding:14}}},scales:{x:{grid:{color:gc},ticks:{color:tc,maxRotation:40}},y:{grid:{color:gc},ticks:{color:tc},beginAtZero:true}}}
  });
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderLog();
restoreTimer();
initPush();
</script>

</body>
</html>
